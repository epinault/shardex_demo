services:
  db:
    image: postgres:17
    container_name: shardex_demo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port defaults to 5432; override with SHARDEX_DEMO_PGPORT to avoid
      # clashing with an existing local Postgres.
      - "${SHARDEX_DEMO_PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first boot of an empty data volume, to create the catalog
      # and shard databases (dev + test). To recreate from scratch:
      #   docker compose down -v && docker compose up -d
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
